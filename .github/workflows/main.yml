name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Ust uste dagitim olmasin: ikisi ayni anda `docker compose up` calistirirsa
# konteyner yaris haline giriyor ve biri yarim kalmis imajla ayaga kalkiyor.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, evlilik]

    steps:
      - uses: actions/checkout@v4

      # Sirlari EN BASTA dogrula. Yoksa imaj 2 dakika derleniyor, konteyner
      # ayaga kalkiyor, sonra her istek 500 veriyor ve saglik kontrolu
      # 2 dakika daha bekleyip "ayaga kalkmadi" diyor — asil sebep
      # (eksik AUTH_SECRET) ancak konteyner loglarinda gorunuyor.
      - name: Gerekli sırlar tanımlı mı
        env:
          ADMIN_KULLANICI: ${{ secrets.ADMIN_KULLANICI }}
          ADMIN_PASSWORD_HASH_B64: ${{ secrets.ADMIN_PASSWORD_HASH_B64 }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          eksik=0
          for ad in ADMIN_KULLANICI ADMIN_PASSWORD_HASH_B64 AUTH_SECRET; do
            deger="${!ad}"
            if [ -z "$deger" ]; then
              echo "::error::GitHub secret eksik: $ad"
              eksik=1
            fi
          done
          # AUTH_SECRET en az 32 karakter olmali — lib/session.ts bunu
          # zorunlu tutuyor ve kisa olursa HER istek 500 doner.
          if [ -n "$AUTH_SECRET" ] && [ ${#AUTH_SECRET} -lt 32 ]; then
            echo "::error::AUTH_SECRET ${#AUTH_SECRET} karakter, en az 32 olmalı."
            echo "::error::Üretmek için: node -e \"console.log(require('crypto').randomBytes(32).toString('hex'))\""
            eksik=1
          fi
          [ "$eksik" -eq 0 ] || exit 1
          echo "Sırlar tamam."

      - name: .env dosyasini yaz
        run: |
          umask 077
          cat > .env <<'EOF'
          ADMIN_KULLANICI=${{ secrets.ADMIN_KULLANICI }}
          ADMIN_PASSWORD_HASH_B64=${{ secrets.ADMIN_PASSWORD_HASH_B64 }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          DB_PATH=/srv/data/nisan.db
          MEDYA_KOK=/srv/medya/scenes
          TZ=Europe/Istanbul
          EOF

      # Konteyner `node` kullanicisi (uid 1000) olarak calisiyor, ama bind
      # mount edilen klasorleri Docker yoksa ROOT olarak yaratir. O zaman
      # SQLite yazamaz ve konteyner acilir acilmaz oluyor. Klasorleri
      # onceden dogru sahiplikle kuruyoruz.
      # sudo YOK: runner'in sudo hakki olmayabilir, kok yetkisini gecici
      # bir konteynerden aliyoruz — docker zaten calistirabiliyor.
      - name: Kalici klasorleri hazirla
        run: |
          docker run --rm \
            -v /srv/nisan-data:/d \
            -v /srv/nisan-medya:/m \
            alpine:3 sh -c 'mkdir -p /m/scenes /m/anlar && chown -R 1000:1000 /d /m'

      - name: Onceki konteyneri durdur
        run: docker compose down --remove-orphans || true

      # Migration'lar konteynerin CMD'sinde calisiyor (migrate && start).
      # Hepsi `INSERT OR IGNORE` / `CREATE TABLE IF NOT EXISTS` — mevcut
      # metinleri, aile isimlerini ve ayarlari EZMEZ.
      - name: Derle ve baslat
        run: docker compose up -d --build

      - name: Sağlık kontrolü
        run: |
          # curl ciktisi bastirilir: 40 basarisiz denemede 40 satir hata
          # basmak asil sebebi (konteyner logu) ekranin disina itiyordu.
          for i in $(seq 1 40); do
            kod=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2608/ || echo 000)
            if [ "$kod" = "200" ]; then
              echo "Ayakta (${i}. deneme)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Uygulama ayağa kalkmadı — son HTTP kodu: $kod"
          echo "--- konteyner logu ---"
          docker compose logs --tail=40 nisan
          exit 1

      - name: Sırları temizle
        if: always()
        run: rm -f .env
